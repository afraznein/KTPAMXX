# public/resdk/engine/rehlds_api.h is a manual copy of KTP-ReHLDS's
# rehlds/public/rehlds/rehlds_api.h, compiled into BOTH shipped KTPAMXX
# artifacts (core and dodx). It is deliberately a PREFIX of the engine's
# header -- fewer IRehldsHookchains entries, none the engine lacks -- so the
# byte-diff the KTP-ReHLDS/KTP-ReAPI gates use cannot apply here. What must
# hold instead, and what this gate enforces:
#   1. REHLDS_API_VERSION_MAJOR/MINOR equal the engine's. The runtime
#      handshake is `minor < compiled_minor` and cannot see layout drift, so
#      the version literals are the only tie between the copies.
#   2. Each ORDERED surface here -- IRehldsHookchains, RehldsFuncs_t and
#      IRehldsApi -- is an exact in-order prefix of the engine's, with matching
#      arity at every shared index. Consumers bind vtable[N] / offset N at
#      compile time; a mid-list insert or reorder is a silent wrong call at
#      runtime, not a load failure. Slots are APPEND-ONLY, at the engine's tail.
#      Enforced by KTP-ReHLDS's own rehlds_api_prefix.py, not re-implemented
#      here: one checker, owned by the repo that owns the layout.
# Both sides are CR-stripped before comparison -- the sibling gates pass on a
# line-ending coincidence, and this one must not.
#
# Trigger is unfiltered on purpose (see version-consistency.yml): a
# path-filtered required check never reports, and the branch can then never
# merge.

name: Header Drift

on:
  workflow_dispatch:
    inputs:
      rehlds_ref:
        description: 'KTP-ReHLDS ref to compare rehlds_api.h against. Blank = the same-named branch if it exists, else its default branch.'
        required: false
        type: string
        default: ''
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  header-drift:
    name: rehlds_api.h prefix vs KTP-ReHLDS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KTPAMXX
        uses: actions/checkout@v6

      # Checking out the counterpart with no ref reads its DEFAULT branch, so a
      # coordinated header change on feature branches in both repos would fail
      # here until one merged. Prefer a same-named branch; else the default.
      - name: Resolve KTP-ReHLDS ref
        id: counterpart
        env:
          COUNTERPART: https://github.com/afraznein/KTP-ReHLDS.git
          OVERRIDE: ${{ inputs.rehlds_ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            REF="$OVERRIDE"
            echo "dispatch override: $REF"
          elif [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$COUNTERPART" "refs/heads/$BRANCH" >/dev/null 2>&1; then
            REF="$BRANCH"
            echo "matched same-named branch on KTP-ReHLDS: $REF"
          else
            REF=$(git ls-remote --symref "$COUNTERPART" HEAD | awk '/^ref:/ { sub("refs/heads/", "", $2); print $2; exit }')
            echo "no matching branch on KTP-ReHLDS; using its default branch: $REF"
          fi
          # An empty ref makes checkout take the default branch, so a probe that
          # died would read as a passing comparison instead of a failure.
          test -n "$REF" || { echo "::error::could not resolve a KTP-ReHLDS ref to compare against"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout KTP-ReHLDS
        uses: actions/checkout@v6
        with:
          repository: afraznein/KTP-ReHLDS
          ref: ${{ steps.counterpart.outputs.ref }}
          path: ktprehlds

      - name: Compare version macros
        env:
          REF: ${{ steps.counterpart.outputs.ref }}
        run: |
          set -euo pipefail
          AMXX=public/resdk/engine/rehlds_api.h
          ENGINE=ktprehlds/rehlds/public/rehlds/rehlds_api.h

          macro() { tr -d '\r' < "$1" | grep -E "^#define REHLDS_API_VERSION_$2 " | tr -s ' \t' ' '; }
          for m in MAJOR MINOR; do
            a="$(macro "$AMXX" "$m")"
            e="$(macro "$ENGINE" "$m")"
            # An extraction that matches nothing is a dead probe, not agreement.
            test -n "$a" || { echo "::error::REHLDS_API_VERSION_$m not found in $AMXX"; exit 1; }
            test -n "$e" || { echo "::error::REHLDS_API_VERSION_$m not found in $ENGINE"; exit 1; }
            if [ "$a" != "$e" ]; then
              echo "::error::REHLDS_API_VERSION_$m differs: KTPAMXX has '$a', engine has '$e'. The runtime guard compares these literals and cannot see layout drift -- bump them together or not at all. Compared against KTP-ReHLDS @ $REF."
              exit 1
            fi
          done

          echo "OK: version macros match (KTP-ReHLDS @ $REF)"

      # The prefix rule is enforced by the ENGINE's own checker, from the engine
      # ref just checked out, so the authority on the layout also owns the test.
      # It covers all three ordered surfaces; the shell check this replaced read
      # IRehldsHookchains only, and a RehldsFuncs_t or IRehldsApi insert passed
      # green. Both of those bind by offset exactly like the vtable does.
      - name: Prefix-check every ordered ABI surface
        env:
          REF: ${{ steps.counterpart.outputs.ref }}
        run: |
          set -euo pipefail
          CHECKER=ktprehlds/.github/scripts/rehlds_api_prefix.py
          test -f "$CHECKER" || { echo "::error::KTP-ReHLDS @ $REF has no $CHECKER -- the engine side carries the checker; sync it before relying on this gate."; exit 1; }

          # Run its selftest first: a checker whose matcher has broken reports a
          # clean prefix on anything, and this gate's whole value is its failures.
          python3 "$CHECKER" --selftest

          # One --require per surface. A name on no surface is itself an error in
          # the checker, so these are live controls rather than decoration:
          # SV_UpdatePausedHUD is the KTP pause hook both copies must agree on.
          python3 "$CHECKER" \
            --engine   ktprehlds/rehlds/public/rehlds/rehlds_api.h \
            --consumer public/resdk/engine/rehlds_api.h \
            --require SV_UpdatePausedHUD \
            --require DropClient \
            --require GetHookchains
          echo "OK: all three ordered surfaces are in-order prefixes (KTP-ReHLDS @ $REF)"

      # A byte mirror, not a prefix: dodx reads the struct by layout across the
      # module boundary, and a change is a new ktp_rewind_vN name, never an edit.
      - name: Diff the mirrored ktp_rewind_api.h
        env:
          REF: ${{ steps.counterpart.outputs.ref }}
        run: |
          set -euo pipefail
          AMXX=public/resdk/engine/ktp_rewind_api.h
          ENGINE=ktprehlds/rehlds/public/rehlds/ktp_rewind_api.h
          test -f "$AMXX" || { echo "::error::$AMXX missing -- dead probe"; exit 1; }
          test -f "$ENGINE" || { echo "::error::KTP-ReHLDS @ $REF has no ktp_rewind_api.h; the engine side merges first."; exit 1; }
          if ! diff -u "$ENGINE" "$AMXX"; then
            echo "::error::ktp_rewind_api.h has DRIFTED from KTP-ReHLDS @ $REF."
            exit 1
          fi
          echo "OK: ktp_rewind_api.h is byte-identical to KTP-ReHLDS @ $REF"
