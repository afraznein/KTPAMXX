# Calls KTPInfrastructure's Lane B harness to replay the deterministic stats
# corpus against this PR's KTPAMXX.
#
# Every ref below except `amxx_ref` is pinned to one lineage, and that is
# load-bearing rather than tidiness. The reusable workflow defaults each unsupplied
# `*_ref` to that same lineage, so any ref this file supplies from a GitHub context
# is a chance to assemble one lineage's harness against another's repositories.
#
# `amxx_ref` is the one ref that must NOT be pinned: it is the artifact under
# test, and pinning it would leave the lane reporting on code the PR never
# touched. support/check_lane_refs.py enforces both halves of that rule.
#
# The `uses:` line below is pinned to a commit SHA, not a branch name. GitHub
# requires that ref to be a literal, and a literal branch name still moves. The
# reusable workflow's inner job is named `Lane B (${{ inputs.lane }}, ${{
# matrix.target_ref }}, run ${{ matrix.run_index }})`, which composes the required
# status check `corpus-regression / Lane B (corpus, main, run 1)`. A rename of that
# job upstream would mean the required context can never report again, with no
# failing check to point at. Pinning the SHA freezes which version of the
# orchestration code runs until we deliberately move it. Re-pin when the harness
# needs something newer; support/check_lane_refs.py asserts that the `lane: corpus`
# literal below still composes the required context, though it cannot see an
# upstream rename.
#
# `infrastructure_ref` and `daemon_ref` are literals that select which commit gets
# CHECKED OUT once the pinned workflow code is running, left live so the harness
# content keeps tracking its branch.

name: Corpus Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # Cheap and deterministic, and deliberately NOT a dependency of the lane below.
  # Gating the lane on it would leave the required `corpus-regression / Lane B`
  # context skipped rather than failing, and a required check that never reports
  # blocks the branch instead of reporting on it.
  ref-pairing:
    name: lane ref pairing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Run first. A gate that only ever passes proves nothing, so make it
      # demonstrate that it still rejects a straddled call before believing the
      # real result.
      - name: Prove the gate discriminates
        run: python3 support/check_lane_refs.py --selftest

      - name: Check Lane B ref pairing
        run: python3 support/check_lane_refs.py

  corpus-regression:
    # Pinned to a KTPInfrastructure commit (#201). Re-pin deliberately when the
    # harness needs to move; see the file header comment.
    uses: afraznein/KTPInfrastructure/.github/workflows/lane-b-stats-e2e.yml@457a02cf5627e3105d46160e068581d6c4fc0965
    with:
      lane: corpus
      infrastructure_ref: main
      amxx_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      daemon_ref: main
    secrets: inherit
